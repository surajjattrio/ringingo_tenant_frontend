version: "3.8"

services:
  ringingo-tenant-fs:
    container_name: ringingo-tenant-fs
    build: .

    restart: always

    environment:
      TZ: Asia/Kolkata

    network_mode: host

    env_file:
      - .env

    volumes:
      - /opt/caching:/opt/caching
      - /usr/local/freeswitch:/usr/local/freeswitch
